# PetDate CI — lint/typecheck/build on every PR and push.
# Does NOT deploy. Deploy is only via deploy.yml (main/master + approval).
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'cursor/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared → api → bot → web
        run: npm run build:all

      - name: API selftests (safe / no VPS)
        run: bash ./scripts/ci-selftest.sh

      - name: Predeploy integrity check (informational on feature branches)
        env:
          ALLOW_DEPLOY: '1'
        run: bash ./scripts/predeploy-check.sh
