# Dedicated WebSocket endpoint for petdate chat.
# Prefer DNS A → origin IP (185.110.189.218) WITHOUT CDN so Upgrade works.

server {
  listen 80;
  listen [::]:80;
  server_name ws.petdate.ir;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name ws.petdate.ir;

  ssl_certificate /etc/letsencrypt/live/ws.petdate.ir/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ws.petdate.ir/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ws/ {
    proxy_pass http://127.0.0.1:3001/api/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location / {
    default_type text/plain;
    return 200 "petdate websocket origin\n";
  }
}
