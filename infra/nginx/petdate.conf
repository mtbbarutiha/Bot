# petdate.ir — origin for CDN (HTTP:80) + local HTTPS (443 self-signed until LE)
# Prefer CDN SSL mode "Flexible" (CDN HTTPS → origin HTTP) OR "Full" (not Full Strict) with this self-signed.

# Shared real IP trust for Iranian CDNs (Arvan + common proxies)
geo $is_cdn_or_local {
  default 0;
  127.0.0.1/32 1;
}

map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  https https;
  http http;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name petdate.ir www.petdate.ir _;
  client_max_body_size 20m;

  # Trust CDN / proxy client IP when present
  # Arvan Cloud published ranges (approx; update if CDN docs change)
  set_real_ip_from 185.143.232.0/22;
  set_real_ip_from 188.229.0.0/16;
  set_real_ip_from 5.160.0.0/16;
  set_real_ip_from 79.175.128.0/18;
  set_real_ip_from 164.138.128.0/18;
  set_real_ip_from 37.32.0.0/16;
  set_real_ip_from 46.224.0.0/16;
  set_real_ip_from 91.98.0.0/16;
  set_real_ip_from 94.182.0.0/16;
  set_real_ip_from 2.144.0.0/13;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  root /opt/petdate/packages/web/dist;
  index index.html;

  # Health for CDN origin checks
  location = /cdn-cgi/health { return 200 "ok\n"; add_header Content-Type text/plain; }
  location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

  location /api/ {
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /rx {
    proxy_pass http://127.0.0.1:3001/rx;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /assets/brand/ {
    proxy_pass http://127.0.0.1:3001/assets/brand/;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    try_files $uri =404;
  }

  location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name petdate.ir www.petdate.ir _;
  client_max_body_size 20m;

  ssl_certificate     /etc/nginx/ssl/petdate.crt;
  ssl_certificate_key /etc/nginx/ssl/petdate.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  set_real_ip_from 185.143.232.0/22;
  set_real_ip_from 188.229.0.0/16;
  set_real_ip_from 5.160.0.0/16;
  set_real_ip_from 79.175.128.0/18;
  set_real_ip_from 164.138.128.0/18;
  set_real_ip_from 37.32.0.0/16;
  set_real_ip_from 46.224.0.0/16;
  set_real_ip_from 91.98.0.0/16;
  set_real_ip_from 94.182.0.0/16;
  set_real_ip_from 2.144.0.0/13;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  root /opt/petdate/packages/web/dist;
  index index.html;

  location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

  location /api/ {
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /rx {
    proxy_pass http://127.0.0.1:3001/rx;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /assets/brand/ {
    proxy_pass http://127.0.0.1:3001/assets/brand/;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    try_files $uri =404;
  }

  location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
