# Drop into /etc/nginx/conf.d/gzip.conf
# Default nginx gzip_types is only text/html — JS/CSS were shipped uncompressed (~1.5MB+).
# `gzip on` already lives in nginx.conf — do not repeat it here.

gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_http_version 1.1;
gzip_types
  text/plain
  text/css
  text/javascript
  text/xml
  application/javascript
  application/x-javascript
  application/json
  application/ld+json
  application/manifest+json
  application/xml
  application/rss+xml
  application/atom+xml
  application/vnd.ms-fontobject
  font/ttf
  font/otf
  font/woff
  font/woff2
  image/svg+xml
  image/x-icon;
